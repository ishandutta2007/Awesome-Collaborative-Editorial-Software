<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .tag-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Ambient Pulsing / Dynamic Floating */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.7; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(-35px, 20px) scale(1.1); opacity: 0.65; }
    }
    @keyframes pulseBeam {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
      50% { stroke-dashoffset: 80; opacity: 0.8; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .orb-1 { animation: floatOrb1 9s ease-in-out infinite; transform-origin: 220px 100px; }
    .orb-2 { animation: floatOrb2 11s ease-in-out infinite; transform-origin: 1000px 320px; }
    .pulse-line {
      stroke-dasharray: 8 12;
      animation: pulseBeam 6s linear infinite;
    }
    .dynamic-node {
      animation: nodePulse 4s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="160" fill="#6366f1" filter="url(#orbBlur)" />
  <circle class="orb-2" cx="980" cy="300" r="170" fill="#a855f7" filter="url(#orbBlur)" />
  <circle cx="600" cy="210" r="130" fill="#06b6d4" opacity="0.15" filter="url(#orbBlur)" />

  <!-- Dynamic Workflow Path Lines (Background Decoration) -->
  <path class="pulse-line" d="M 80 80 Q 300 20 600 80 T 1120 80" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
  <path class="pulse-line" d="M 80 350 Q 400 400 700 350 T 1120 350" fill="none" stroke="url(#cyanGrad)" stroke-width="2" />

  <!-- Outer Frame / Border Glow -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Header Category Eyebrow -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text y="3" class="tag-title" text-anchor="middle">✦ Curated Open Ecosystem ✦</text>
  </g>

  <!-- MAIN FOREGROUND TITLE (Crisp, High-Contrast, Foreground Guaranteed) -->
  <!-- Subtle back-shadow for extreme clarity against any glow -->
  <text x="600" y="145" class="title-text" text-anchor="middle" fill="#020617" opacity="0.8" dy="2">Awesome Collaborative Editorial Software</text>
  <text x="600" y="145" class="title-text" text-anchor="middle">Awesome Collaborative Editorial Software</text>

  <!-- SUBTITLE -->
  <text x="600" y="185" class="subtitle-text" text-anchor="middle">
    SaaS Platforms, Open-Source Engines &amp; Self-Hosted Pipelines for Digital &amp; Print Publishing
  </text>

  <!-- Decorative Foreground Feature Pills -->
  <g transform="translate(600, 245)">
    <!-- Pill 1: Real-time Editing -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="170" height="44" rx="22" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="24" cy="22" r="6" fill="#6366f1" />
      <text x="40" y="27" class="badge-text">⚡ Real-Time Co-authoring</text>
    </g>

    <!-- Pill 2: Git & CRDTs -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="170" height="44" rx="22" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="24" cy="22" r="6" fill="#8b5cf6" />
      <text x="40" y="27" class="badge-text">🔄 Git &amp; CRDT Sync</text>
    </g>

    <!-- Pill 3: InDesign / Multi-channel -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="44" rx="22" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="24" cy="22" r="6" fill="#ec4899" />
      <text x="40" y="27" class="badge-text">📰 Multi-Channel Output</text>
    </g>

    <!-- Pill 4: End-to-End Privacy -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="24" cy="22" r="6" fill="#06b6d4" />
      <text x="40" y="27" class="badge-text">🔒 Encrypted / Self-Hosted</text>
    </g>
  </g>

  <!-- Editorial Workflow Indicator Bar at the Bottom -->
  <g transform="translate(230, 335)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="80" y="23" class="badge-text" text-anchor="middle" fill="#94a3b8">1. Draft &amp; Structure</text>

    <!-- Arrow -->
    <path d="M 175 18 L 195 18" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <polygon points="195,14 203,18 195,22" fill="#6366f1" />

    <!-- Stage 2 -->
    <rect x="215" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="295" y="23" class="badge-text" text-anchor="middle" fill="#94a3b8">2. Review &amp; Edit</text>

    <!-- Arrow -->
    <path d="M 390 18 L 410 18" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <polygon points="410,14 418,18 410,22" fill="#a855f7" />

    <!-- Stage 3 -->
    <rect x="430" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="510" y="23" class="badge-text" text-anchor="middle" fill="#94a3b8">3. Layout &amp; Prepress</text>

    <!-- Arrow -->
    <path d="M 605 18 L 625 18" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <polygon points="625,14 633,18 625,22" fill="#06b6d4" />

    <!-- Stage 4 -->
    <rect x="645" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="725" y="23" class="badge-text" text-anchor="middle" fill="#38bdf8">4. Multi-Publish</text>
  </g>
</svg>
